name: AI Daily Curator (ai-curate)

on:
  schedule:
    # UTC 0:00 = 北京时间 8:00
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write # 需要写权限来 commit 日报文件

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # 消除 Node.js 20 deprecation warning

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # 翻译+抓取可能较慢

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate AI Daily Report
        run: python scripts/generate_report.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/daily/ latest.md
          git diff --cached --quiet || git commit -m "chore: daily report $(date +%Y-%m-%d)"
          git push

      - name: Send email
        run: python scripts/send_email.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QQ_MAIL_AUTH_CODE: ${{ secrets.QQ_MAIL_AUTH_CODE }}
